<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Featured project showcase</title>
  <desc id="desc">An animated showcase of CareLoop, ScamLens, CareerTrack, NeuraFlow AI, MediTrax, and Frontend Portfolio.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071429"/>
      <stop offset="0.55" stop-color="#0b2042"/>
      <stop offset="1" stop-color="#101b36"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#60a5fa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#background)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1020" cy="76" r="130" fill="#2563eb" opacity=".12"/>
  <circle cx="176" cy="322" r="125" fill="#14b8a6" opacity=".08"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="63" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="3">FEATURED WORK</text>
    <text x="60" y="100" fill="#f8fafc" font-size="28" font-weight="700">Building thoughtful software</text>
    <rect x="60" y="122" width="320" height="2" fill="url(#line)"/>
    <text x="60" y="150" fill="#b6c7e5" font-size="16">Full-stack platforms · AI tools · privacy-first products</text>
  </g>

  <g>
    <path d="M34 245C155 187 222 309 340 245S540 183 658 244s219 61 346 4 153-31 166-18" fill="none" stroke="url(#line)" stroke-width="2" opacity=".7">
      <animate attributeName="stroke-dasharray" values="1 14;14 1;1 14" dur="7s" repeatCount="indefinite"/>
    </path>
    <circle cx="340" cy="245" r="5" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="658" cy="244" r="5" fill="#a78bfa" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="3.5s" begin=".6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1004" cy="230" r="5" fill="#2dd4bf" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="3s" begin=".3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(60 188)">
    <animateTransform attributeName="transform" type="translate" values="60 188;60 180;60 188" dur="4.6s" repeatCount="indefinite"/>
    <rect width="250" height="105" rx="14" fill="#0e2a4d" stroke="#38bdf8" stroke-opacity=".65"/>
    <rect width="5" height="105" rx="2.5" fill="#38bdf8"/>
    <text x="24" y="35" fill="#e0f2fe" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">CareLoop</text>
    <text x="24" y="61" fill="#a5c5ea" font-family="Arial, Helvetica, sans-serif" font-size="13">Family health organiser</text>
    <text x="24" y="85" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="12">NEXT.JS · SUPABASE</text>
  </g>

  <g transform="translate(340 205)">
    <animateTransform attributeName="transform" type="translate" values="340 205;340 215;340 205" dur="5.1s" begin=".4s" repeatCount="indefinite"/>
    <rect width="250" height="105" rx="14" fill="#162653" stroke="#a78bfa" stroke-opacity=".65"/>
    <rect width="5" height="105" rx="2.5" fill="#a78bfa"/>
    <text x="24" y="35" fill="#ede9fe" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">ScamLens</text>
    <text x="24" y="61" fill="#c9c6ec" font-family="Arial, Helvetica, sans-serif" font-size="13">Scam &amp; phishing checker</text>
    <text x="24" y="85" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="12">NEXT.JS · TYPESCRIPT</text>
  </g>

  <g transform="translate(620 188)">
    <animateTransform attributeName="transform" type="translate" values="620 188;620 179;620 188" dur="4.2s" begin=".8s" repeatCount="indefinite"/>
    <rect width="250" height="105" rx="14" fill="#0e3240" stroke="#2dd4bf" stroke-opacity=".65"/>
    <rect width="5" height="105" rx="2.5" fill="#2dd4bf"/>
    <text x="24" y="35" fill="#ccfbf1" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">CareerTrack</text>
    <text x="24" y="61" fill="#b9dad8" font-family="Arial, Helvetica, sans-serif" font-size="13">Job application workspace</text>
    <text x="24" y="85" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="12">NEXT.JS · POSTGRESQL</text>
  </g>

  <g transform="translate(900 205)">
    <animateTransform attributeName="transform" type="translate" values="900 205;900 215;900 205" dur="4.9s" begin=".2s" repeatCount="indefinite"/>
    <rect width="240" height="105" rx="14" fill="#24234c" stroke="#f472b6" stroke-opacity=".65"/>
    <rect width="5" height="105" rx="2.5" fill="#f472b6"/>
    <text x="24" y="35" fill="#fce7f3" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">NeuraFlow AI</text>
    <text x="24" y="61" fill="#eac8dd" font-family="Arial, Helvetica, sans-serif" font-size="13">AI productivity toolkit</text>
    <text x="24" y="85" fill="#f9a8d4" font-family="Arial, Helvetica, sans-serif" font-size="12">REACT · TYPESCRIPT</text>
  </g>
</svg>