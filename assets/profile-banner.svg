<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fatima Afzal — software developer portfolio</title>
  <desc id="desc">Animated navy, cyan, and indigo developer portfolio banner</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080F1D"/>
      <stop offset=".62" stop-color="#101B35"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="742" y1="80" x2="1126" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 175) rotate(90) scale(204 305)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity=".48"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#93C5FD" fill-opacity=".28"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <rect x="720" width="480" height="360" rx="18" fill="url(#dots)" opacity=".54"/>
  <g filter="url(#blur)">
    <circle cx="1000" cy="180" r="148" fill="#2563EB" fill-opacity=".34">
      <animate attributeName="r" values="135;158;135" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".24;.42;.24" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M690 286C760 239 779 150 864 146C951 142 971 242 1040 217C1081 203 1107 148 1148 102" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 10" opacity=".9">
    <animate attributeName="stroke-dashoffset" values="0;-68" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M716 249C789 203 817 279 887 228C955 178 982 107 1097 135" stroke="#67E8F9" stroke-width="1.2" stroke-linecap="round" opacity=".58">
    <animate attributeName="d" values="M716 249C789 203 817 279 887 228C955 178 982 107 1097 135;M716 249C786 215 824 252 887 228C951 191 992 122 1097 135;M716 249C789 203 817 279 887 228C955 178 982 107 1097 135" dur="5s" repeatCount="indefinite"/>
  </path>
  <g>
    <circle cx="864" cy="146" r="6" fill="#22D3EE">
      <animate attributeName="r" values="5;8;5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="217" r="5" fill="#A5B4FC">
      <animate attributeName="r" values="4;7;4" dur="2.2s" begin=".7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="54" y="52" width="5" height="54" rx="2.5" fill="#22D3EE">
    <animate attributeName="height" values="54;72;54" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <text x="80" y="72" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3.4">SOFTWARE DEVELOPER</text>
  <text x="78" y="168" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.2">Fatima Afzal</text>
  <text x="80" y="211" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="20">Building thoughtful, useful digital products.</text>
  <line x1="80" y1="246" x2="564" y2="246" stroke="#94A3B8" stroke-opacity=".35"/>
  <text x="80" y="284" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5">WEB APPS  ·  AI TOOLS  ·  DESKTOP SYSTEMS</text>
  <text x="896" y="304" fill="#BFDBFE" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PORTFOLIO / 2026</text>
</svg>
